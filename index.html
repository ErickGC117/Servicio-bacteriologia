<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Pedidos de Bacteriología</title>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body>
    <h1>Formulario de Pedido</h1>
    <form id="pedido-form">
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre" required><br><br>

        <label for="descripcion">Descripción del Pedido:</label>
        <textarea id="descripcion" name="descripcion" required></textarea><br><br>

        <label for="cantidad">Cantidad:</label>
        <input type="number" id="cantidad" name="cantidad" required><br><br>

        <button type="submit">Enviar Pedido</button>
    </form>

    <h2>Pedidos Realizados</h2>
    <ul id="lista-pedidos"></ul>

    <script>
        // URL del backend (remplazada por tu servidor)
        const apiUrl = "https://pedidos-servicio-de-bacteriologia-fesc1.onrender.com/api/pedidos";

        // Función para enviar el pedido al backend
        document.getElementById("pedido-form").addEventListener("submit", function (e) {
            e.preventDefault();
            
            const nombre = document.getElementById("nombre").value;
            const descripcion = document.getElementById("descripcion").value;
            const cantidad = document.getElementById("cantidad").value;

            const pedido = {
                nombre,
                descripcion,
                cantidad
            };

            // Enviar los datos del pedido al servidor usando Axios
            axios.post(apiUrl, pedido)
                .then(function (response) {
                    alert("Pedido enviado exitosamente");
                    cargarPedidos();
                })
                .catch(function (error) {
                    console.error("Hubo un error:", error);
                });
        });

        // Función para cargar los pedidos desde el backend
        function cargarPedidos() {
            axios.get(apiUrl)
                .then(function (response) {
                    const pedidos = response.data;
                    const listaPedidos = document.getElementById("lista-pedidos");
                    listaPedidos.innerHTML = ""; // Limpiar la lista antes de cargar nuevos pedidos

                    pedidos.forEach(function (pedido) {
                        const li = document.createElement("li");
                        li.textContent = `Nombre: ${pedido.nombre}, Descripción: ${pedido.descripcion}, Cantidad: ${pedido.cantidad}`;
                        listaPedidos.appendChild(li);
                    });
                })
                .catch(function (error) {
                    console.error("Hubo un error al cargar los pedidos:", error);
                });
        }

        // Cargar los pedidos al cargar la página
        cargarPedidos();
    </script>
</body>
</html>
